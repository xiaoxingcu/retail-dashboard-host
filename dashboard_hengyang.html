function fmtPct(v, d) {
  d = d || 2;
  if (v === null || v === undefined || v === '') return '-';
  return (v * 100).toFixed(d) + '%';
}
function fmtNum(v, d) {
  d = d || 0;
  if (v === null || v === undefined || v === '') return '-';
  return Number(v).toLocaleString('zh-CN', {minimumFractionDigits: d, maximumFractionDigits: d});
}
function fmtTime(v) {
  if (v === null || v === undefined || v === '') return '-';
  var n = Number(v);
  if (isNaN(n)) return '-';
  if (n < 1) return (n * 60).toFixed(1) + 's';
  return n.toFixed(1) + 'min';
}

function colorPct(v, inverse) {
  if (v === null || v === undefined || v === '') return '';
  var n = Number(v);
  if (isNaN(n)) return '';
  if (inverse) {
    if (n <= 0.002) return 'bg-green';
    if (n <= 0.005) return 'bg-light-green';
    if (n <= 0.02) return 'bg-yellow';
    return 'bg-red';
  } else {
    if (n >= 0.98) return 'bg-green';
    if (n >= 0.95) return 'bg-light-green';
    if (n >= 0.90) return 'bg-yellow';
    return 'bg-red';
  }
}

function getBadge(row) {
  var badges = [];
  var ontime = row[4];
  var imperfect = row[5];
  if (ontime !== undefined && ontime < 0.90) badges.push('<span class="badge badge-danger">准时率&lt;90%</span>');
  else if (ontime !== undefined && ontime < 0.95) badges.push('<span class="badge badge-warn">准时率&lt;95%</span>');
  if (imperfect !== undefined && imperfect > 0.10) badges.push('<span class="badge badge-danger">不完美&gt;10%</span>');
  else if (imperfect !== undefined && imperfect > 0.05) badges.push('<span class="badge badge-warn">不完美&gt;5%</span>');
  return badges.join(' ');
}

function renderKPIs() {
  var agg = mtdData[mtdData.length - 1];
  var kpis = [
    { label: '日均订单', value: fmtNum(agg[1]), unit: '单', cls: '' },
    { label: '妥投率', value: fmtPct(agg[2]), unit: '', cls: agg[2] >= 0.98 ? 'good' : 'bad' },
    { label: '物流责未妥投率', value: fmtPct(agg[3], 4), unit: '', cls: agg[3] <= 0.002 ? 'good' : 'bad' },
    { label: '用户T准时率', value: fmtPct(agg[4]), unit: '', cls: agg[4] >= 0.95 ? 'good' : (agg[4] >= 0.90 ? 'warn' : 'bad') },
    { label: '不完美订单率', value: fmtPct(agg[5]), unit: '', cls: agg[5] <= 0.05 ? 'good' : (agg[5] <= 0.10 ? 'warn' : 'bad') },
    { label: '实际T时长', value: fmtTime(agg[6]), unit: '', cls: agg[6] <= 42 ? 'good' : (agg[6] <= 45 ? 'warn' : 'bad') },
  ];
  var html = '';
  kpis.forEach(function(k) {
    html += '<div class="kpi-card ' + k.cls + '"><div class="label">' + k.label + '</div><div class="value">' + k.value + '</div>' + (k.unit ? '<div class="unit">' + k.unit + '</div>' : '') + '</div>';
  });
  document.getElementById('kpiRow').innerHTML = html;
}

function initStationSelector() {
  var sel = document.getElementById('stationSelect');
  var stations = Object.keys(dailyData);
  if (stations.length === 0) {
    sel.innerHTML = '<option>暂无日维度数据</option>';
    return;
  }
  stations.sort(function(a, b) {
    var da = dailyData[a], db = dailyData[b];
    var sa = da.reduce(function(s, r) { return s + (r[1]||0); }, 0);
    var sb = db.reduce(function(s, r) { return s + (r[1]||0); }, 0);
    return sb - sa;
  });
  stations.forEach(function(s, i) {
    var opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  showDaily();
}

  reversed.forEach(function(row) {

    var isWeekend = [0,6].includes(dow);
    var dowName = ['日','一','二','三','四','五','六'][dow];
    html += '<tr' + (isWeekend ? ' style="background:#f0f7ff"' : '') + '>';
    html += '<td style="font-weight:600">' + dateStr + ' 周' + dowName + '</td>';
    html += '<td>' + fmtNum(row[1]) + '</td>';
    html += '<td class="' + colorPct(row[2], false) + '">' + fmtPct(row[2]) + '</td>';
    html += '<td class="' + colorPct(row[3], true) + '">' + fmtPct(row[3], 4) + '</td>';
    html += '<td class="' + colorPct(row[4], false) + '">' + fmtPct(row[4]) + '</td>';
    html += '<td class="' + colorPct(row[5], true) + '">' + fmtPct(row[5]) + '</td>';
    html += '<td>' + fmtTime(row[6]) + '</td>';
    html += '<td>' + fmtTime(row[7]) + '</td>';
    html += '<td>' + fmtTime(row[8]) + '</td>';
    html += '<td>' + fmtTime(row[9]) + '</td>';
    html += '<td>' + fmtTime(row[10]) + '</td>';
    html += '<td>' + fmtTime(row[11]) + '</td>';
    html += '<td>' + fmtTime(row[12]) + '</td>';
    html += '<td>' + fmtTime(row[13]) + '</td>';
    html += '</tr>';
  });
  document.getElementById('dailyBody').innerHTML = html;
}

renderKPIs();
renderMTDTable();
initStationSelector();
</script>
