<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9月聚合送高校物流数据看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 15px; }
  .container { max-width: 1500px; margin: 0 auto; padding: 20px; }
  .main-title { background: linear-gradient(135deg, #1a5276, #2980b9); color: white; padding: 18px 28px; border-radius: 10px; font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .main-title .subtitle { font-size: 14px; font-weight: 400; opacity: 0.85; }
  .section-header { background: #2471a3; color: white; padding: 10px 18px; border-radius: 6px 6px 0 0; font-size: 16px; font-weight: 600; margin-top: 20px; }
  .section-header.green { background: #1e8449; }
  .section-header.orange { background: #ca6f1e; }
  .card { background: white; border-radius: 0 0 8px 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 4px; }
  .kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpi-card { flex: 1; min-width: 150px; background: #f8f9fa; border-radius: 8px; padding: 12px 14px; text-align: center; border-left: 4px solid #2980b9; }
  .kpi-card .label { font-size: 12px; color: #666; margin-bottom: 3px; }
  .kpi-card .value { font-size: 20px; font-weight: 700; color: #1a1a2e; }
  .kpi-card .unit { font-size: 11px; color: #888; }
  .kpi-card.good { border-left-color: #27ae60; }
  .kpi-card.good .value { color: #27ae60; }
  .kpi-card.bad { border-left-color: #e74c3c; }
  .kpi-card.bad .value { color: #e74c3c; }
  .kpi-card.warn { border-left-color: #f39c12; }
  .kpi-card.warn .value { color: #e67e22; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #eaf2f8; color: #1a5276; padding: 7px 8px; text-align: center; font-weight: 600; border: 1px solid #d5dbdb; white-space: nowrap; font-size: 12px; }
  td { padding: 6px 8px; text-align: center; border: 1px solid #e8e8e8; }
  tr:nth-child(even) { background: #fafbfc; }
  tr:hover { background: #eef5fb; }
  .station-name { text-align: left; font-weight: 500; white-space: nowrap; }
  .summary-row { background: #eaf2f8 !important; font-weight: 700; }
  .summary-row td { border-top: 2px solid #2980b9; }
  .bg-green { background: #d5f5e3 !important; color: #1e8449; font-weight: 600; }
  .bg-red { background: #fadbd8 !important; color: #c0392b; font-weight: 600; }
  .bg-yellow { background: #fef9e7 !important; color: #b7950b; font-weight: 600; }
  .bg-light-green { background: #eafaf1 !important; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; margin-left: 3px; }
  .badge-warn { background: #fdebd0; color: #b7950b; }
  .badge-danger { background: #fadbd8; color: #c0392b; }
  .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; margin-top: 20px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">

<div class="main-title">
  <div>
    <div>9月聚合送高校物流数据看板</div>
    <div class="subtitle">数据截至 2026-09-29 | 9个衡阳聚合送站点</div>
  </div>
  <div style="font-size:13px;opacity:0.8">淘宝闪购·城代业务运营</div>
</div>

<div class="section-header"> 各站点月累计（9月MTD）</div>
<div class="card">
  <div class="kpi-row" id="kpiRow"></div>
  <div class="table-wrap">
    <table id="mtdTable">
      <thead><tr>
        <th>站点</th><th>日均订单</th><th>妥投率</th><th>物流责未妥投率</th><th>用户T准时率</th><th>不完美订单率</th>
        <th>实际T时长</th><th>调度时长</th><th>配送时长</th><th>接单时长</th><th>到店时长</th><th>取餐时长</th><th>送达时长</th><th>确认时长</th>
      </tr></thead>
      <tbody id="mtdBody"></tbody>
    </table>
  </div>
</div>

<div class="section-header green">📅 各站点日维度数据</div>
<div class="card">
  <div style="display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap">
    <label style="font-weight:600;color:#1a5276;font-size:14px">选择站点：</label>
    <select id="stationSelect" onchange="showDaily()" style="padding:8px 14px;border:2px solid #2980b9;border-radius:6px;font-size:14px;background:white;min-width:300px;cursor:pointer">
    </select>
    <span id="dailyHint" style="font-size:13px;color:#888"></span>
  </div>
  <div class="kpi-row" id="dailyKpiRow"></div>
  <div class="table-wrap">
    <table id="dailyTable">
      <thead><tr>
        <th>日期</th><th>当日订单</th><th>妥投率</th><th>物流责未妥投率</th><th>用户T准时率</th><th>不完美订单率</th>
        <th>实际T时长</th><th>调度时长</th><th>配送时长</th><th>接单时长</th><th>到店时长</th><th>取餐时长</th><th>送达时长</th><th>确认时长</th>
      </tr></thead>
      <tbody id="dailyBody"></tbody>
    </table>
  </div>
</div>

<div class="footer">淘宝闪购·城代业务运营 · 高校聚合送物流质量看板 · 数据截至2026-09-29</div>
</div>

<script>
const mtdData = [
  ['蒸湘南华红湘站（聚合送）',1873,0.984517,0.0,0.943352,0.028,38.6,12.05,38.23,1.6,3.05,20.22,2.91,0.03],
  ['石鼓环境生物学院站点（聚合送）',1668,0.981415,0.0,0.9429,0.0186,37.91,8.11,37.37,0.001,3.14,20.22,5.89,0.02],
  ['蒸湘交通工程学院站（聚合送）',1208,0.990894,0.000828,0.823546,0.1349,49.1,21.0,49.05,0.001,2.36,14.12,11.57,0.04],
  ['珠晖工学院站（聚合送）',113,null,null,null,null,null,null,null,null,null,null,null,null],
  ['珠晖师范学院新校区站（聚合送）',72,null,null,null,null,null,null,null,null,null,null,null,null],
  ['珠晖高铁学院站（聚合送）',58,null,null,null,null,null,null,null,null,null,null,null,null],
  ['雁峰师范学院西校区站（聚合送）',13,null,null,null,null,null,null,null,null,null,null,null,null],
  ['珠晖财经学院站（聚合送）',4,null,null,null,null,null,null,null,null,null,null,null,null],
  ['衡阳科技职业学院站（聚合送）',1,null,null,null,null,null,null,null,null,null,null,null,null],
];
const dailyData = {};

function fmtPct(v, d) {
  d = d || 2;
  if (v === null || v === undefined || v === '') return '-';
  return (v * 100).toFixed(d) + '%';
}
function fmtNum(v, d) {
  d = d || 0;
  if (v === null || v === undefined || v === '') return '-';
  return Number(v).toLocaleString('zh-CN', {minimumFractionDigits: d, maximumFractionDigits: d});
}
function fmtTime(v) {
  if (v === null || v === undefined || v === '') return '-';
  var n = Number(v);
  if (isNaN(n)) return '-';
  if (n < 1) return (n * 60).toFixed(1) + 's';
  return n.toFixed(1) + 'min';
}

function colorPct(v, inverse) {
  if (v === null || v === undefined || v === '') return '';
  var n = Number(v);
  if (isNaN(n)) return '';
  if (inverse) {
    if (n <= 0.002) return 'bg-green';
    if (n <= 0.005) return 'bg-light-green';
    if (n <= 0.02) return 'bg-yellow';
    return 'bg-red';
  } else {
    if (n >= 0.98) return 'bg-green';
    if (n >= 0.95) return 'bg-light-green';
    if (n >= 0.90) return 'bg-yellow';
    return 'bg-red';
  }
}

function getBadge(row) {
  var badges = [];
  var ontime = row[4];
  var imperfect = row[5];
  if (ontime !== undefined && ontime < 0.90) badges.push('<span class="badge badge-danger">准时率&lt;90%</span>');
  else if (ontime !== undefined && ontime < 0.95) badges.push('<span class="badge badge-warn">准时率&lt;95%</span>');
  if (imperfect !== undefined && imperfect > 0.10) badges.push('<span class="badge badge-danger">不完美&gt;10%</span>');
  else if (imperfect !== undefined && imperfect > 0.05) badges.push('<span class="badge badge-warn">不完美&gt;5%</span>');
  return badges.join(' ');
}

function renderKPIs() {
  var totalOrders = mtdData.reduce(function(s, r) { return s + (r[1]||0); }, 0);
  function wavg(idx) {
    if (totalOrders === 0) return 0;
    return mtdData.reduce(function(s, r) { return s + (r[idx]||0) * (r[1]||0); }, 0) / totalOrders;
  }
  var kpis = [
    { label: '日均订单', value: fmtNum(totalOrders), unit: '单', cls: '' },
    { label: '妥投率', value: fmtPct(wavg(2)), unit: '', cls: wavg(2) >= 0.98 ? 'good' : 'bad' },
    { label: '物流责未妥投率', value: fmtPct(wavg(3), 4), unit: '', cls: wavg(3) <= 0.002 ? 'good' : 'bad' },
    { label: '用户T准时率', value: fmtPct(wavg(4)), unit: '', cls: wavg(4) >= 0.95 ? 'good' : (wavg(4) >= 0.90 ? 'warn' : 'bad') },
    { label: '不完美订单率', value: fmtPct(wavg(5)), unit: '', cls: wavg(5) <= 0.05 ? 'good' : (wavg(5) <= 0.10 ? 'warn' : 'bad') },
    { label: '实际T时长', value: fmtTime(wavg(6)), unit: '', cls: wavg(6) <= 42 ? 'good' : (wavg(6) <= 45 ? 'warn' : 'bad') },
  ];
  var html = '';
  kpis.forEach(function(k) {
    html += '<div class="kpi-card ' + k.cls + '"><div class="label">' + k.label + '</div><div class="value">' + k.value + '</div>' + (k.unit ? '<div class="unit">' + k.unit + '</div>' : '') + '</div>';
  });
  document.getElementById('kpiRow').innerHTML = html;
}

function renderMTDTable() {
  var html = '';
  mtdData.forEach(function(row, i) {
    var badges = getBadge(row);
    html += '<tr>';
    html += '<td class="station-name">' + row[0] + ' ' + badges + '</td>';
    html += '<td>' + fmtNum(row[1]) + '</td>';
    html += '<td class="' + colorPct(row[2], false) + '">' + fmtPct(row[2]) + '</td>';
    html += '<td class="' + colorPct(row[3], true) + '">' + fmtPct(row[3], 4) + '</td>';
    html += '<td class="' + colorPct(row[4], false) + '">' + fmtPct(row[4]) + '</td>';
    html += '<td class="' + colorPct(row[5], true) + '">' + fmtPct(row[5]) + '</td>';
    html += '<td>' + fmtTime(row[6]) + '</td>';
    html += '<td>' + fmtTime(row[7]) + '</td>';
    html += '<td>' + fmtTime(row[8]) + '</td>';
    html += '<td>' + fmtTime(row[9]) + '</td>';
    html += '<td>' + fmtTime(row[10]) + '</td>';
    html += '<td>' + fmtTime(row[11]) + '</td>';
    html += '<td>' + fmtTime(row[12]) + '</td>';
    html += '<td>' + fmtTime(row[13]) + '</td>';
    html += '</tr>';
  });
  document.getElementById('mtdBody').innerHTML = html;
}

function initStationSelector() {
  var sel = document.getElementById('stationSelect');
  var stations = Object.keys(dailyData);
  if (stations.length === 0) {
    sel.innerHTML = '<option>暂无日维度数据</option>';
    return;
  }
  stations.sort(function(a, b) {
    var da = dailyData[a], db = dailyData[b];
    var sa = da.reduce(function(s, r) { return s + (r[1]||0); }, 0);
    var sb = db.reduce(function(s, r) { return s + (r[1]||0); }, 0);
    return sb - sa;
  });
  stations.forEach(function(s, i) {
    var opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  showDaily();
}

function showDaily() {
  var name = document.getElementById('stationSelect').value;
  var rows = dailyData[name] || [];
  document.getElementById('dailyHint').textContent = '共 ' + rows.length + ' 天数据';

  // KPI row for selected station (latest day)
  if (rows.length > 0) {
    var latest = rows[rows.length - 1];
    var kpis = [
      { label: '最新日订单', value: fmtNum(latest[1]), unit: '单', cls: '' },
      { label: '妥投率', value: fmtPct(latest[2]), unit: '', cls: latest[2] >= 0.98 ? 'good' : 'bad' },
      { label: '物流责未妥投率', value: fmtPct(latest[3], 4), unit: '', cls: latest[3] <= 0.002 ? 'good' : 'bad' },
      { label: '用户T准时率', value: fmtPct(latest[4]), unit: '', cls: latest[4] >= 0.95 ? 'good' : (latest[4] >= 0.90 ? 'warn' : 'bad') },
      { label: '不完美订单率', value: fmtPct(latest[5]), unit: '', cls: latest[5] <= 0.05 ? 'good' : (latest[5] <= 0.10 ? 'warn' : 'bad') },
      { label: '实际T时长', value: fmtTime(latest[6]), unit: '', cls: latest[6] <= 42 ? 'good' : (latest[6] <= 45 ? 'warn' : 'bad') },
    ];
    var kpiHtml = '';
    kpis.forEach(function(k) {
      kpiHtml += '<div class="kpi-card ' + k.cls + '"><div class="label">' + k.label + '</div><div class="value">' + k.value + '</div>' + (k.unit ? '<div class="unit">' + k.unit + '</div>' : '') + '</div>';
    });
    document.getElementById('dailyKpiRow').innerHTML = kpiHtml;
  }

  // Daily trend table (newest first)
  var reversed = rows.slice().reverse();
  var html = '';
  reversed.forEach(function(row) {
    var ds = String(row[0]);
    var dateStr = ds.slice(0,4) + '-' + ds.slice(4,6) + '-' + ds.slice(6,8);
    var dow = new Date(ds.slice(0,4), parseInt(ds.slice(4,6))-1, ds.slice(6,8)).getDay();
    var isWeekend = [0,6].includes(dow);
    var dowName = ['日','一','二','三','四','五','六'][dow];
    html += '<tr' + (isWeekend ? ' style="background:#f0f7ff"' : '') + '>';
    html += '<td style="font-weight:600">' + dateStr + ' 周' + dowName + '</td>';
    html += '<td>' + fmtNum(row[1]) + '</td>';
    html += '<td class="' + colorPct(row[2], false) + '">' + fmtPct(row[2]) + '</td>';
    html += '<td class="' + colorPct(row[3], true) + '">' + fmtPct(row[3], 4) + '</td>';
    html += '<td class="' + colorPct(row[4], false) + '">' + fmtPct(row[4]) + '</td>';
    html += '<td class="' + colorPct(row[5], true) + '">' + fmtPct(row[5]) + '</td>';
    html += '<td>' + fmtTime(row[6]) + '</td>';
    html += '<td>' + fmtTime(row[7]) + '</td>';
    html += '<td>' + fmtTime(row[8]) + '</td>';
    html += '<td>' + fmtTime(row[9]) + '</td>';
    html += '<td>' + fmtTime(row[10]) + '</td>';
    html += '<td>' + fmtTime(row[11]) + '</td>';
    html += '<td>' + fmtTime(row[12]) + '</td>';
    html += '<td>' + fmtTime(row[13]) + '</td>';
    html += '</tr>';
  });
  document.getElementById('dailyBody').innerHTML = html;
}

renderKPIs();
renderMTDTable();
initStationSelector();
</script>
</body>
</html>
