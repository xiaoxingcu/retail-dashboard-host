      if(i===8){style="color:var(--red);font-weight:600";} // A5合格在售商品数(=0需报名)
      if(i===9){cls="";} // 净笔单
      if(i===10){cls="";} // 是否做工(留空给BD填)
      return "<td class='"+cls+"' style='"+style+"'>"+esc(v)+"</td>";
    }).join("")+"</tr>";
  });
  document.getElementById('gz').innerHTML=h;
}
sel.addEventListener('change',e=>renderCity(e.target.value));
if(cityList.length) renderCity(cityList[0]);
</script>
