const CAP = DATA.cap, W = DATA.weights;
function pct(x){return (x==null)?"—":(x*100).toFixed(1)+"%";}
function rc(x){if(x==null)return "var(--grey)";const r=x>3?x/100:x;if(r>=CAP)return "var(--green)";if(r>=1.15)return "var(--lgreen)";if(r>=1.0)return "var(--amber)";return "var(--red)";}
function tierOf(x){if(x==null)return["无数据","var(--grey)"];const r=x>3?x/100:x;if(r>=CAP)return["达标","var(--green)"];if(r>=1.15)return["较好","var(--lgreen)"];if(r>=1.0)return["一般","var(--amber)"];return["较差","var(--red)"];}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById('sub').textContent = "数据截至 "+DATA.date_disp+"　·　自动生成";

(function(){

  let h="<tr><th>城市</th><th>规模</th><th>阶段</th><th>JBP</th><th>综合得分</th><th>档位</th><th>订单率</th><th>覆盖</th><th>渗透</th></tr>";
  rows.forEach(c=>{const t=tierOf(c.score);
    h+="<tr><td class='l'>"+esc(c.name)+"</td><td>"+esc(c.size||"—")+"</td><td>"+esc(c.stage||"—")+"</td><td>"+(c.jbp==null?"—":c.jbp)+"</td>"

      +"<td><span class='tag' style='background:"+t[1]+"'>"+t[0]+"</span></td>"
      +"<td style='color:"+rc(c["订单"])+"'>"+pct(c["订单"])+"</td>"
      +"<td style='color:"+rc(c["覆盖"])+"'>"+pct(c["覆盖"])+"</td>"
      +"<td style='color:"+rc(c["渗透"])+"'>"+pct(c["渗透"])+"</td></tr>";});
  document.getElementById('sum').innerHTML=h;
})();

function deltaOf(hist){const v=(hist||[]).filter(x=>typeof x==='number');return v.length>=2?(v[0]-v[v.length-1]):null;}
function renderCity(city){
  const blk=DATA.cities[city]||{bdm:[],bd:[],gz_data:[],todo_total:0};
  document.getElementById('cityMeta').textContent="待报名商户 "+blk.todo_total+" 家";
  // BDM / BD 表
  function personTable(list){
    let h="<tr><th>姓名</th><th>当前覆盖率</th><th>近7天变化</th></tr>";
    list.forEach(p=>{const dl=deltaOf(p.hist);const col=rc(p.rate);
      const dtxt=(dl==null)?"—":((dl>=0?"+":"")+(dl*100).toFixed(1)+"pp");
      const dcol=(dl==null)?"var(--grey)":(dl>0.0005?"var(--green)":(dl<-0.0005?"var(--red)":"var(--amber)"));
      h+="<tr><td class='l'>"+esc(p.name)+"</td><td style='color:"+col+";font-weight:600'>"+pct(p.rate)
        +"<span class='bar'><i style='width:"+Math.min(100,(p.rate||0)*100)+"%;background:"+col+"'></i></span></td>"
        +"<td style='color:"+dcol+"'>"+dtxt+"</td></tr>";});
    return h;
  }
  document.getElementById('bdm').innerHTML=personTable(blk.bdm);
  document.getElementById('bd').innerHTML=personTable(blk.bd);
  // 做工明细
  const hd=DATA.gz_headers;
  let h="<tr>"+hd.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>";
  (blk.gz_data||[]).forEach(r=>{
    h+="<tr>"+r.map((v,i)=>{
      let style="",cls="l";
      if(i===7){style="color:var(--red);font-weight:600";} // 是否策略商户池
      if(i===8){style="color:var(--red);font-weight:600";} // A5合格在售商品数(=0需报名)
      if(i===9){cls="";} // 净笔单
      if(i===10){cls="";} // 是否做工(留空给BD填)
      return "<td class='"+cls+"' style='"+style+"'>"+esc(v)+"</td>";
    }).join("")+"</tr>";
  });
  document.getElementById('gz').innerHTML=h;
}
sel.addEventListener('change',e=>renderCity(e.target.value));
